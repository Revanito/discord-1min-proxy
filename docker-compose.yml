# Fill out the .env file for variables
services:
  proxy:
    build: ./proxy
    restart: unless-stopped
    environment:
      ONE_MIN_API_KEY: ${ONE_MIN_API_KEY}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET}
      MODEL_EASY: ${MODEL_EASY:-grok-4-fast-non-reasoning}
      MODEL_MEDIUM: ${MODEL_MEDIUM:-grok-4-fast-reasoning}
      MODEL_HARD: ${MODEL_HARD:-grok-4.5}
      MODEL_CLASSIFIER: ${MODEL_CLASSIFIER:-gpt-4o-mini}
    volumes:
      - proxy-data:/app/data
    ports:
      - "8000:8000"

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      PROXY_URL: http://proxy:8000
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET}
      ALLOWED_GUILD_IDS: ${ALLOWED_GUILD_IDS:-}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}

volumes:
  proxy-data:
